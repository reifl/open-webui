services:
  open-webui-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Skip pre-downloading ML models — they'll download on first use instead.
        # This makes the first build significantly faster.
        USE_SLIM: "true"
    container_name: open-webui-dev
    volumes:
      # Mount backend source so uvicorn --reload picks up changes without rebuilding
      - ./backend/open_webui:/app/backend/open_webui
      # Persist DB, uploads, model cache across restarts
      - open-webui-dev-data:/app/backend/data
    ports:
      - "3000:8080"
    environment:
      - WEBUI_SECRET_KEY=dev-secret-key
      - CORS_ALLOW_ORIGIN=*
      - OPENAI_API_KEY=none
      - OPENAI_API_BASE_URL=http://192.168.2.182:8081/v1
    extra_hosts:
      - host.docker.internal:host-gateway
    command: >
      uvicorn open_webui.main:app
      --port 8080
      --host 0.0.0.0
      --forwarded-allow-ips '*'
      --reload
    restart: unless-stopped

volumes:
  open-webui-dev-data: {}
